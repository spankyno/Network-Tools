name: Upstash keep-alive

on:
  schedule:
    # Minutos "raros" a propósito (evita las horas en punto, donde GitHub tiene más retrasos).
    - cron: '17 6 * * *'
    - cron: '43 15 * * 1,3,5'
  workflow_dispatch: {}   # ejecución manual desde la pestaña Actions

permissions:
  contents: read

concurrency:
  group: upstash-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/upstash-keepalive.mjs
          sparse-checkout-cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar actividad en Upstash
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}          # opcional: https://network-tools-aif.pages.dev
          JITTER_MAX_SEC: '900'                 # hasta 15 min de espera aleatoria
          SKIP_PROBABILITY: '0.15'              # 15 % de las ejecuciones programadas no hacen nada
        run: node scripts/upstash-keepalive.mjs

  # Evita que GitHub desactive este workflow tras 60 días sin actividad en el repo.
  # Vuelve a "habilitar" el workflow en cada ejecución programada, lo que reinicia el contador.
  # No crea commits. Usa la CLI `gh`, ya incluida en ubuntu-latest (sin acciones de terceros).
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-habilitar el workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/upstash-keepalive.yml/enable"
